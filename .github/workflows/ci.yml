name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pricing engine + API)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Pricing engine tests
        # Run the money logic on its own first: it has no DB dependency, so a
        # failure here is unambiguously a formula regression.
        run: python -m pytest pricing/tests -v

      - name: API + schema tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/srg_test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/srg_test
          ADMIN_API_KEY: test-admin-key
        run: python -m pytest tests -v
